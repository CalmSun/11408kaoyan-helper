name: kaoyan_helper
description: 11408 考研助手 - 全平台版（Flutter + iOS 26 液态玻璃设计）
publish_to: 'none'
version: 3.6.5+365

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # iOS 26 液态玻璃组件库（折射 / 色散 / 高光 / 动态光照，Impeller fragment shader）
  liquid_glass_widgets: ^1.16.1
  cupertino_icons: ^1.0.8
  # 本地存储（跨 Windows / Linux / Android，对应 Electron 的 localStorage）
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

