name: Flutter

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  # ── push main：编译验证（不发布）。本机无 Flutter，靠这里每轮发现编译错误 ──
  analyze:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate scaffolding
        run: |
          cd flutter-app
          flutter create --empty --platforms=linux --org com.kaoyan --project-name kaoyan_helper .

      - name: Pub get + Analyze
        run: |
          cd flutter-app
          flutter pub get
          flutter analyze

  # ── tag：Android APK ──
  build-android:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: |
          cd flutter-app
          flutter create --empty --platforms=android --org com.kaoyan --project-name kaoyan_helper .

      - name: Build APK
        run: |
          cd flutter-app
          flutter pub get
          flutter build apk --release

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          name: 11408 考研助手 v${{ github.ref_name }}
          fail_on_unmatched_files: true

  # ── tag：Windows x64 ──
  build-windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows scaffolding
        shell: bash
        run: |
          cd flutter-app
          flutter create --empty --platforms=windows --org com.kaoyan --project-name kaoyan_helper .

      - name: Build Windows
        shell: bash
        run: |
          cd flutter-app
          flutter pub get
          flutter build windows --release

      - name: Package Windows zip
        shell: powershell
        run: |
          cd flutter-app
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "kaoyan-helper-windows-x64.zip" -Force

      - name: Upload Windows to Release
        uses: softprops/action-gh-release@v2
        with:
          files: flutter-app/kaoyan-helper-windows-x64.zip
          name: 11408 考研助手 v${{ github.ref_name }}
          fail_on_unmatched_files: true

  # ── tag：Linux x64 ──
  build-linux:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev clang cmake pkg-config

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Linux scaffolding
        run: |
          cd flutter-app
          flutter create --empty --platforms=linux --org com.kaoyan --project-name kaoyan_helper .

      - name: Build Linux
        run: |
          cd flutter-app
          flutter pub get
          flutter build linux --release

      - name: Package Linux tarball
        run: |
          cd flutter-app/build/linux/x64/release
          tar -czf kaoyan-helper-linux-x64.tar.gz bundle/

      - name: Upload Linux to Release
        uses: softprops/action-gh-release@v2
        with:
          files: flutter-app/build/linux/x64/release/kaoyan-helper-linux-x64.tar.gz
          name: 11408 考研助手 v${{ github.ref_name }}
          fail_on_unmatched_files: true
