<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>考研助手 - 你的专属备考伙伴</title>
  </head>
  <body>
    <!--
      液态玻璃折射滤镜（v3.6.6）
      backdrop-filter 通过 url() 引用这两个滤镜，用 feTurbulence + feDisplacementMap
      让玻璃真正"折射"背后的内容，而不是用 blur 把它糊掉。
      两档：默认（scale 9，克制的液面）/ 强折射（scale 16，超通透档与大面板）。
      不支持 url() 的浏览器由 style.css 的 @supports 兜底为低模糊方案。
    -->
    <svg width="0" height="0" aria-hidden="true" focusable="false"
         style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
      <defs>
        <filter id="kaoyan-glass-wave" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.011 0.015" numOctaves="1" seed="9" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="kaoyan-glass-wave-strong" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="1" seed="4" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
