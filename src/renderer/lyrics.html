<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>桌面歌词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  :root {
    --lrc-size: 26px;
    --lrc-color: #ffffff;
    --lrc-opacity: 1;
    --lrc-align: center;
  }
  body {
    display: flex; flex-direction: column; justify-content: center;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    opacity: var(--lrc-opacity);
    -webkit-app-region: drag;
    transition: opacity .2s ease;
  }
  /* 锁定（鼠标穿透）时整窗不接收鼠标事件，拖拽语义也随之失效 */
  body.locked { -webkit-app-region: no-drag; }
  .wrap {
    width: 100%; padding: 8px 20px;
    text-align: var(--lrc-align);
  }
  .line {
    font-size: var(--lrc-size);
    font-weight: 700; line-height: 1.32; letter-spacing: .5px;
    color: var(--lrc-color);
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 4px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.75);
    word-break: break-word;
    transition: opacity .25s ease;
  }
  .line.dim { opacity: .55; font-size: calc(var(--lrc-size) * .72); }
  .line.paused { opacity: .72; }
  .w { position: relative; display: inline-block; white-space: pre; }
  .w-on {
    position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    color: var(--lrc-color); overflow: hidden; pointer-events: none;
    /* 未唱到的部分透明；clip-path 由脚本按进度裁剪 */
  }
  .w-base { opacity: .45; }
  .trans {
    margin-top: 6px;
    font-size: calc(var(--lrc-size) * .52);
    font-weight: 500; line-height: 1.35;
    color: var(--lrc-color); opacity: .72;
    text-shadow: 0 0 2px rgba(0,0,0,.9), 0 1px 3px rgba(0,0,0,.85);
    white-space: pre-wrap; word-break: break-word;
  }
  .next {
    margin-top: 5px;
    font-size: calc(var(--lrc-size) * .46);
    font-weight: 500; opacity: .5; color: var(--lrc-color);
    text-shadow: 0 0 2px rgba(0,0,0,.9), 0 1px 3px rgba(0,0,0,.85);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hide { display: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line dim" id="line"><span id="lineText">桌面歌词已就绪</span></div>
    <div class="trans hide" id="trans"></div>
    <div class="next hide" id="next"></div>
  </div>
<script>
  // v3.6.8 桌面歌词窗：纯 DOM 实现，不引入任何框架运行时。
  // 逐字填充由本窗口本地时钟推进（只用 requestAnimationFrame，且仅在播放中且该行有逐字数据时运行），
  // 因此主进程/渲染进程无需按帧推 IPC。
  var lineEl = document.getElementById('line')
  var lineTextEl = document.getElementById('lineText')
  var transEl = document.getElementById('trans')
  var nextEl = document.getElementById('next')

  var cfg = { fontSize: 26, color: '#ffffff', opacity: 1, align: 'center', showTranslation: true, showNext: true, locked: false }
  var state = { line: '', trans: '', next: '', title: '', playing: false, words: null, lineTime: 0 }
  var clock = { base: 0, at: 0, running: false }
  var rafId = 0
  var spans = []   // [{ el, fill, time, end }]
  var lastLine = null

  function applyConfig(c) {
    if (!c) return
    cfg = Object.assign({}, cfg, c)
    var root = document.documentElement.style
    root.setProperty('--lrc-size', cfg.fontSize + 'px')
    root.setProperty('--lrc-color', cfg.color)
    root.setProperty('--lrc-opacity', cfg.opacity)
    root.setProperty('--lrc-align', cfg.align)
    transEl.classList.toggle('hide', !cfg.showTranslation || !state.trans)
    nextEl.classList.toggle('hide', !cfg.showNext || !state.next)
    document.body.classList.toggle('locked', !!cfg.locked)
  }

  function buildWords(words) {
    spans = []
    lineTextEl.textContent = ''
    for (var i = 0; i < words.length; i++) {
      var w = words[i]
      var wrap = document.createElement('span')
      wrap.className = 'w'
      var base = document.createElement('span')
      base.className = 'w-base'
      base.textContent = w.text
      var on = document.createElement('span')
      on.className = 'w-on'
      on.textContent = w.text
      on.style.clipPath = 'inset(0 100% 0 0)'
      wrap.appendChild(base)
      wrap.appendChild(on)
      lineTextEl.appendChild(wrap)
      spans.push({ on: on, time: w.time, end: w.time + (w.duration || 0.3) })
    }
  }

  function paintWords(t) {
    var changed = false
    for (var i = 0; i < spans.length; i++) {
      var s = spans[i]
      var p
      if (t >= s.end) p = 1
      else if (t <= s.time) p = 0
      else p = (t - s.time) / (s.end - s.time)
      var clip = 'inset(0 ' + ((1 - p) * 100).toFixed(1) + '% 0 0)'
      if (s.on.style.clipPath !== clip) { s.on.style.clipPath = clip; changed = true }
    }
    return changed
  }

  function tick() {
    rafId = 0
    if (!clock.running) return
    var t = clock.base + (performance.now() - clock.at) / 1000
    paintWords(t)
    rafId = requestAnimationFrame(tick)
  }

  function startClock() {
    if (rafId) return
    if (!state.words || !state.words.length) return
    clock.base = state.lineTime
    clock.at = performance.now()
    clock.running = true
    rafId = requestAnimationFrame(tick)
  }

  function stopClock() {
    clock.running = false
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0 }
  }

  function render(p) {
    if (!p) return
    state.playing = p.playing !== false
    if (typeof p.line === 'string') state.line = p.line
    if (typeof p.trans === 'string') state.trans = p.trans
    if (typeof p.next === 'string') state.next = p.next
    if (typeof p.title === 'string') state.title = p.title
    if (typeof p.lineTime === 'number') state.lineTime = p.lineTime
    // 显式覆盖：该行没有逐字数据时必须清空，否则会残留上一行的时间轴
    state.words = Array.isArray(p.words) && p.words.length ? p.words : null

    var text = state.line
    var key = text + '\u0001' + (state.words ? state.words.length : 0) + '\u0001' + state.playing
    if (key !== lastLine) {
      lastLine = key
      stopClock()
      if (state.words && state.words.length) {
        buildWords(state.words)
        lineEl.classList.remove('dim')
        // 静态先画一次，避免闪空
        paintWords(state.lineTime)
        if (state.playing) startClock()
      } else {
        spans = []
        lineTextEl.textContent = text || (state.title || '♪ 音乐播放中')
        lineEl.classList.toggle('dim', !text)
      }
      transEl.textContent = state.trans || ''
      nextEl.textContent = state.next || ''
      transEl.classList.toggle('hide', !cfg.showTranslation || !state.trans)
      nextEl.classList.toggle('hide', !cfg.showNext || !state.next)
    }

    lineEl.classList.toggle('paused', !state.playing)
    if (!state.playing) stopClock()
    else if (state.words && state.words.length) startClock()
  }

  window.lyricsAPI.onConfig(applyConfig)
  window.lyricsAPI.onRender(render)
  window.lyricsAPI.ready()
</script>
</body>
</html>
