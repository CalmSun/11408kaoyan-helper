<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>桌面歌词</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default;
    -webkit-app-region: drag;
  }
  .wrap { width: 100%; padding: 10px 18px; text-align: center; }
  .line {
    font-size: 26px; font-weight: 700; line-height: 1.35; letter-spacing: .5px;
    color: #fff;
    text-shadow: 0 0 2px rgba(0,0,0,.95), 0 1px 4px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.75);
    /* 允许两行，长句不整句截断 */
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
    transition: opacity .28s ease;
  }
  .line.dim { opacity: .55; }
  .next {
    margin-top: 6px; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.62);
    text-shadow: 0 0 2px rgba(0,0,0,.9), 0 1px 3px rgba(0,0,0,.85);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .empty { font-size: 16px; color: rgba(255,255,255,.5); text-shadow: 0 1px 3px rgba(0,0,0,.85); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="line dim" id="line">桌面歌词已就绪</div>
    <div class="next" id="next"></div>
  </div>
<script>
  // 纯 DOM 实现：不引入任何框架运行时，歌词窗常驻内存开销极小
  var lineEl = document.getElementById('line')
  var nextEl = document.getElementById('next')
  var lastLine = null
  function render(p) {
    if (!p) return
    var text = (p.line || '').toString()
    if (text !== lastLine) {
      lastLine = text
      if (text) {
        lineEl.textContent = text
        lineEl.classList.remove('dim')
      } else {
        lineEl.textContent = (p.title ? p.title : '♪ 音乐播放中')
        lineEl.classList.add('dim')
      }
      nextEl.textContent = (p.next || '').toString()
    }
    document.body.classList.toggle('paused', p.playing === false)
  }
  window.lyricsAPI.onRender(render)
  window.lyricsAPI.ready()
</script>
</body>
</html>
